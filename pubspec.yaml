name: clinixai
description: ClinixAI multilingual symptom-based diagnosis chatbot.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.1.1
  shared_preferences: ^2.0.15
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  dio: ^5.0.0
  riverpod: ^3.0.3
  flutter_cube: ^0.1.1
  model_viewer_plus: ^1.9.3
  hive: ^2.0.5
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/icons/
    - lib/i18n/
