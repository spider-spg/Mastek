name: symptom_checker
description: A multilingual voice & text symptom-checker chatbot (Flutter)
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  google_fonts: ^7.0.2
  waveform_flutter: ^1.2.0
  speech_to_text: any
  flutter_tts: ^3.5.2
  translator: ^1.0.4+1
  shared_preferences: ^2.1.1
  intl: ^0.20.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  url_launcher: ^6.2.5
  http: ^1.2.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.4
  package_info_plus: ^8.1.3
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/medimitra_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/medimitra_logo.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/.keep
    - assets/icons/.keep